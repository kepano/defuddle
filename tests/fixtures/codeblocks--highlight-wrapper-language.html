<!DOCTYPE html>
<!-- {"url":"https://example.com/highlight-wrappers"} -->
<html>
<head>
	<title>Highlight Wrappers</title>
</head>
<body>
	<main>
		<h1>Highlight wrappers</h1>
		<p>A source wrapper names the language:</p>

		<div class="highlight highlight-source-go notranslate position-relative overflow-auto"><pre><span class="pl-k">var</span> x <span class="pl-k">=</span> <span class="pl-c1">1</span></pre></div>

		<p>A language wrapper around a highlight div:</p>

		<div class="highlight-python notranslate"><div class="highlight"><pre><span></span><span class="n">print</span><span class="p">(</span><span class="s2">"hi"</span><span class="p">)</span>
</pre></div></div>

		<p>A layout class that only starts with highlight is not a language:</p>

		<div class="highlight-wrap"><pre><code>plain text block</code></pre></div>

		<p>That is all for now.</p>
	</main>
</body>
</html>
