<!doctype html><html><head><title>Dangling operators</title></head><body><article>
<p>A useful fraction, 4<span class="sr-only">/</span>3, must retain its separator when both operands remain in the article.</p>
<p>A draft value of 4<span class="sr-only">/</span><span class="advertisement">3</span> must not retain a slash after its hidden denominator is removed.</p>
<p>The label Word<span class="sr-only">/</span>. ends with punctuation, not another operand, so the decorative slash must disappear.</p>
</article></body></html>
