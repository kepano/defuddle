<!doctype html>
<html><head><title>Lazy srcset placeholder</title></head><body><article>
<p>Lazy images may ship a tiny inline placeholder in both src and srcset while the real responsive sources wait in data-srcset.</p>
<p><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" srcset="data:image/gif;base64,R0lGODlhAQABAAAAACw= 1w" data-srcset="https://images.example.com/photo-600.jpg 600w, https://images.example.com/photo-1200.jpg 1200w" class="lazyload" alt="Photo"></p>
<p><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" srcset="data:image/gif;base64,R0lGODlhAQABAAAAACw= 1w" data-lazy-srcset="https://images.example.com/other-600.jpg 600w, https://images.example.com/other-1200.jpg 1200w" class="lazyload" alt="Other"></p>
<p>The extracted image should use the real responsive sources rather than the placeholder source set.</p>
</article></body></html>
