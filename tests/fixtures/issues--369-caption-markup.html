<!doctype html><html><head><title>Caption markup</title></head><body><article><p>This article describes a diagram and credits its sources with links and a numbered reference in the image caption.</p>
<figure><img src="https://example.com/diagram.png" width="600" height="400" alt="Diagram"><figcaption>A <em>diagram</em> by <a href="https://example.net/source">a researcher</a> shows <strong>equal</strong> parts &amp; repeated words: very very useful.<sup class="reference"><a href="#cite_note-1">[1]</a></sup></figcaption></figure>
<p>The caption preserves the source link, emphasis, repeated words, punctuation, and reference so readers can follow the explanation.</p>
<ol class="references"><li id="cite_note-1">A source explaining how to read the diagram.</li></ol></article></body></html>
