<article><h1>MathML converter NBSP</h1><p>This example imports presentation MathML from an attribute. Its non-breaking space belongs to the formula, while surrounding ASCII indentation does not.</p><p><span class="MathJax" data-mathml="&lt;math&gt;&lt;mtext&gt;&#10;    A&amp;nbsp;B&#10;    &lt;/mtext&gt;&lt;/math&gt;"></span></p><p>Ordinary prose keeps its existing cleanup: A&nbsp;&nbsp;B !</p></article>
</body>
