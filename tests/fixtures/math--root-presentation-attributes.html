<html><head><title>Root MathML attributes</title></head><body><article>
<h1>Root MathML attributes</h1>
<p>Direction: <math dir="rtl"><mi>a</mi><mo>+</mo><mi>b</mi></math>.</p>
<p>Math style: <math displaystyle="true"><mfrac><mn>1</mn><mn>2</mn></mfrac></math>.</p>
<p>Math size: <math mathsize="200%"><mi>x</mi></math>.</p>
<p>Descendant control: <math><mstyle dir="rtl" displaystyle="true" mathsize="200%"><mi>x</mi></mstyle></math>.</p>
</article></body></html>
