<!DOCTYPE html>
<!-- {"url":"https://example.com/hljs-bare"} -->
<html>
<head>
	<title>Bare Highlight.js Classes</title>
</head>
<body>
	<main>
		<h1>Bare highlight.js classes</h1>
		<p>highlight.js marks this block with a bare language name:</p>

		<pre><code class="hljs go"><span class="hljs-keyword">package</span> main</code></pre>

		<p>And this one with a bare CSS name:</p>

		<pre><code class="hljs css"><span class="hljs-selector-tag">body</span> { <span class="hljs-attribute">margin</span>: <span class="hljs-number">0</span> }</code></pre>

		<p>That is all for now.</p>
	</main>
</body>
</html>
