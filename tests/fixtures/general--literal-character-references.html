<html><head><title>Writing character references</title></head><body><article>
<h1>Writing character references</h1>
<p>A non-breaking space is written as <strong>&amp;nbsp;</strong> in HTML source.</p>
<p>To show a less than sign, write &amp;lt; or &amp;#60; or &amp;#x3C;.</p>
<table>
<tr><th>Result</th><th>Entity name</th><th>Entity number</th></tr>
<tr><td>&lt;</td><td>&amp;lt;</td><td>&amp;#60;</td></tr>
<tr><td>&copy;</td><td>&amp;copy;</td><td>&amp;#169;</td></tr>
</table>
<p>A plain ampersand stays as it is, as in AT&amp;T and a=1&amp;b=2.</p>
</article></body></html>
