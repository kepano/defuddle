<h1>Literal text in equations</h1>
<p>This example contains a formula with text whose spaces are significant.</p>
<p><math display="block" data-latex="\texttt{&lt;div&gt;}">&lt;div&gt;</math></p>
<p>Preserve the original formula as literal source when escaping would change its text.</p>
