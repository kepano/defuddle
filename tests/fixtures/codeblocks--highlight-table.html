<!DOCTYPE html>
<html lang="en">
<head><title>Highlighted code table</title></head>
<body>
<article>
<p>A code viewer can render each source line in a separate table row.</p>
<table class="highlight" data-language="js"><tbody>
<tr><td>const first = 1;</td></tr>
<tr><td>const second = 2;</td></tr>
<tr><td>console.log(first + second);</td></tr>
</tbody></table>
</article>
</body>
</html>
