<h1>Tasks</h1>
<p>Coroutines are scheduled as tasks on the running event loop. Each task wraps a coroutine and runs it to completion.</p>
<p>The signature matches that of <a class="reference internal" href="#example.create_task"><code>example.create_task()</code></a>. See <a class="reference internal" href="#scheduling"><span class="std std-ref">Scheduling</span></a> for details.</p>
<p>Tasks can also be cancelled.<a class="footnote-reference brackets" href="#f1" id="id1">1</a></p>
</main>
