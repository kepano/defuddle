<!DOCTYPE html>
<!-- {"url":"https://example.com/wiki/Example_language"} -->
<html>
<head>
	<title>Example language</title>
</head>
<body>
	<main>
		<h1>Example language</h1>
		<p>A MediaWiki syntaxhighlight block marks the language on its wrapper:</p>

		<div class="mw-highlight mw-highlight-lang-go mw-content-ltr" dir="ltr"><pre><span></span><span class="kd">type</span><span class="w"> </span><span class="nx">counter</span><span class="w"> </span><span class="kt">uint32</span>
</pre></div>

		<p>A language name with symbols:</p>

		<div class="mw-highlight mw-highlight-lang-c++ mw-content-ltr" dir="ltr"><pre><span class="kt">int</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mi">3</span><span class="p">;</span>
</pre></div>

		<p>MediaWiki accepts C# under its own name:</p>

		<div class="mw-highlight mw-highlight-lang-c# mw-content-ltr" dir="ltr"><pre><span></span><span class="k">var</span><span class="w"> </span><span class="n">count</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="m">3</span><span class="p">;</span>
</pre></div>

		<p>And under its usual alias:</p>

		<div class="mw-highlight mw-highlight-lang-csharp mw-content-ltr" dir="ltr"><pre><span class="k">var</span><span class="w"> </span><span class="n">total</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="m">4</span><span class="p">;</span>
</pre></div>

		<p>That is all for now.</p>
	</main>
</body>
</html>
