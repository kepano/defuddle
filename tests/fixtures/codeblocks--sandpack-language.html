<!DOCTYPE html>
<!-- {"url":"https://example.com/learn/components"} -->
<html>
<head>
	<title>Components</title>
</head>
<body>
	<main>
		<h1>Components</h1>
		<p>A Sandpack editor marks the language on the pre element:</p>

		<div class="sp-wrapper"><div class="sp-stack"><div class="sp-code-editor"><pre class="sp-cm sp-pristine sp-javascript flex align-start"><code class="sp-pre-placeholder"><div class="cm-line"><span class="sp-syntax-keyword">const</span> <span class="sp-syntax-definition">items</span> <span class="sp-syntax-punctuation">=</span> <span class="sp-syntax-punctuation">[]</span><span class="sp-syntax-punctuation">;</span></div></code></pre></div></div></div>

		<p>Or on the editor element around it:</p>

		<div class="sp-layout"><div class="sp-editor sp-stack"><div class="sp-code-editor"><div class="sp-pristine sp-javascript sp-cm" role="textbox"><pre class="sp-pre-placeholder"><span class="sp-syntax-keyword">function</span> <span class="sp-syntax-definition">Row</span><span class="sp-syntax-punctuation">()</span> <span class="sp-syntax-punctuation">{}</span></pre></div></div></div></div>

		<p>Its console panel is a Sandpack component, not a shell session:</p>

		<div class="sp-console sp-stack"><div class="sp-console-list"><pre>Hello</pre></div></div>

		<p>That is all for now.</p>
	</main>
</body>
</html>
