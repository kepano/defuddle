<!-- {"url":"https://example.com/article"} -->
<!doctype html>
<html>
<head><title>Caption sibling figure</title></head>
<body>
<article>
<p>This article places an uncaptioned photo next to a captioned figure. Each figure must keep its own image and caption.</p>
<figure><img src="https://example.com/photo.png" width="600" height="400" alt=""></figure>
<figure class="image-text"><img src="https://example.com/second.png" width="600" height="400" alt="Second"><figcaption>The second figure has a caption with <em>emphasis</em> and a <a href="https://example.net/source">source link</a>.</figcaption></figure>
<p>The article continues after the figures with a closing paragraph.</p>
</article>
</body>
</html>
