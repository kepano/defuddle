<!doctype html><html><head><title>Accessible notation</title></head><body><article>
<p>Accessible mathematical notation must retain its operators independently of the class names, identifiers, or inline tags used to present the operands.</p>
<p>Bootstrap: <span><span>4</span><span class="visually-hidden">/</span><span>3</span></span>.</p>
<p>WordPress: <span><b>4</b><span class="screen-reader-text">/</span><em>3</em></span>.</p>
<p>Uppercase: <span><sup>4</sup><span class="SR-Only">/</span><sub>3</sub></span>.</p>
<p>Text operands: <span>4<span class="sr-only-focusable">/</span>3</span>.</p>
<p>Identifier: <span><span>4</span><span id="sr-only-separator">/</span><span>3</span></span>.</p>
</article></body></html>
