<!doctype html><html><head><title>Factorial and prime separators</title></head><body><article>
<p>A factorial fraction uses <span class="sfrac"><span class="tion"><span class="num">n!</span><span class="sr-only">/</span><span class="den">k!</span></span></span> in its formula, and dropping the separator changes its value.</p>
<p>The same rule applies to 5!<span class="sr-only">/</span>3! and f'<span class="sr-only">/</span>g', where the mark before the separator belongs to the left operand.</p>
</article></body></html>
