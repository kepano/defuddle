<!-- {"url":"https://example.com/article"} -->
<!doctype html>
<html>
<head><title>Caption block content</title></head>
<body>
<article>
<p>This article has a figure whose caption contains block elements. The caption should read as a single run of text with its inline markup intact.</p>
<figure><img src="https://example.com/diagram.png" width="600" height="400" alt="Diagram"><figcaption><blockquote>Quoted caption text</blockquote><ul><li>First item with a <a href="https://example.net/source">source link</a></li><li>Second <em>item</em></li></ul><table><tr><td>Cell one</td><td>Cell two</td></tr></table></figcaption></figure>
<p>The article continues after the figure with a closing paragraph.</p>
</article>
</body>
</html>
